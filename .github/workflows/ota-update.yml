name: OTA Update

on:
  push:
    branches:
      - main
      - preview

jobs:
  update:
    name: Deploy OTA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Ces deux étapes sont bloquantes et passent AVANT toute publication: un `eas
      # update` part chez des milliers d'installs sans qu'aucun humain ne relise, donc
      # c'est le dernier filet. Une erreur de typage partait jusqu'ici en production.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --max-warnings=-1

      - name: Tests
        run: npx jest --ci

      # Vérifie que Metro sait réellement produire le bundle. Un import cassé ou un
      # asset manquant échoue ici plutôt que sur le téléphone de l'utilisateur.
      - name: Bundle de contrôle
        run: npx expo export --platform android --output-dir /tmp/ota-smoke

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Deploy OTA update (production)
        if: github.ref == 'refs/heads/main'
        run: |
          eas update \
            --channel production \
            --message "Auto-update from commit ${{ github.sha }}" \
            --non-interactive

      - name: Deploy OTA update (preview)
        if: github.ref == 'refs/heads/preview'
        run: |
          eas update \
            --channel preview \
            --message "Preview update from commit ${{ github.sha }}" \
            --non-interactive
